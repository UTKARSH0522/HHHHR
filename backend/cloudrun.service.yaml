apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hrconnect-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: hrconnect-backend-sa@gen-lang-client-0782301491.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/gen-lang-client-0782301491/hrconnect/backend:TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: "production"
            - name: FIREBASE_PROJECT_ID
              value: "gen-lang-client-0782301491"
            - name: FIRESTORE_DATABASE_ID
              value: "ai-studio-android-hrconnec-b03b6447-7546-4ed2-bdef-5257728737bb"
            - name: RAZORPAY_PAYOUT_MODE
              value: "razorpayx"
            - name: GOOGLE_CALENDAR_ID
              value: "primary"
            - name: RATE_LIMIT_MAX_PER_MIN
              value: "120"
            - name: SENSITIVE_RATE_LIMIT_MAX_PER_MIN
              value: "60"
            - name: ADMIN_EMAILS
              value: "utkarsh.work.contact@gmail.com"
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hrconnect-razorpay-key-id
                  key: latest
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrconnect-razorpay-key-secret
                  key: latest
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hrconnect-razorpay-webhook-secret
                  key: latest
            - name: RAZORPAYX_ACCOUNT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: hrconnect-razorpayx-account-number
                  key: latest
            - name: GOOGLE_SERVICE_ACCOUNT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: hrconnect-google-sa-email
                  key: latest
            - name: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: hrconnect-google-sa-private-key
                  key: latest
            - name: GOOGLE_WORKSPACE_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: hrconnect-google-workspace-subject
                  key: latest
            - name: GOOGLE_WORKSPACE_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: hrconnect-google-workspace-domain
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 15
